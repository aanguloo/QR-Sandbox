# API + orquestador + proxy de salida. Los workers NO son servicios de compose: el
# orquestador crea uno por análisis (en la red `sandbox`) y lo destruye al terminar.
#
# Redes:
#   publica  -> la API publica su puerto (solo loopback por defecto)
#   interna  -> API <-> orquestador (internal: sin salida a internet)
#   sandbox  -> workers <-> proxy (internal: la ÚNICA salida es el proxy)
#   egreso   -> proxy -> internet
services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: qrsandbox-api:dev
    # Por defecto solo se publica en loopback; API_BIND=0.0.0.0 se habilita
    # explícitamente para probar desde el celular por la red local (Fase 5).
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      ORQUESTADOR_URL: http://orquestador:9000
    networks: [publica, interna]
    depends_on:
      orquestador:
        condition: service_healthy
    # Endurecimiento básico (también aplica a la API, no solo al worker).
    # NUNCA montar /var/run/docker.sock aquí: equivale a root en el host.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  orquestador:
    build:
      context: .
      dockerfile: docker/orquestador/Dockerfile
    image: qrsandbox-orquestador:dev
    # Único servicio con el socket de Docker (separación de privilegios).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WORKER_IMAGEN: ${WORKER_IMAGEN:-qrsandbox-worker:dev}
      # basico | endurecido | gvisor (si runsc no está, cae a endurecido y lo registra)
      WORKER_PERFIL: ${WORKER_PERFIL:-gvisor}
      WORKER_RED: qrsandbox_sandbox
      WORKER_PROXY: http://172.31.250.2:3128
      MAX_WORKERS: ${MAX_WORKERS:-3}
    # Solo en la red interna y sin puertos publicados: solo la API lo alcanza.
    networks: [interna]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    # SETUID/SETGID solo para que el re-codificador de frames baje a nobody sin grupos
    # (y así no pueda tocar el socket de Docker), y KILL para poder matarlo si se cuelga.
    # Ver orquestador/recodificador.py. El orquestador ya es "root" vía el socket, así
    # que estas capabilities no le agregan poder real; al hijo no se le heredan.
    cap_add:
      - SETUID
      - SETGID
      - KILL
    depends_on:
      proxy:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    image: qrsandbox-proxy:dev
    networks:
      sandbox:
        ipv4_address: 172.31.250.2  # IP fija: los workers no dependen del DNS de Docker
      egreso: {}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 3128), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped

networks:
  publica: {}
  # internal: sin salida a internet. El orquestador no necesita red externa
  # (habla con el daemon por el socket).
  interna:
    internal: true
  sandbox:
    name: qrsandbox_sandbox  # nombre fijo: el orquestador conecta ahí a los workers
    internal: true
    driver_opts:
      # Sin IP del host en este bridge: los workers NO pueden abrir conexiones a
      # servicios del host (gateway 172.31.250.1) saltándose el proxy. Sin esto, un
      # worker comprometido llegaba a cualquier puerto del host en 0.0.0.0.
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: 172.31.250.0/24
  egreso: {}
