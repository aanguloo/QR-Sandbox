[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qrsandbox"
version = "0.0.1"
description = "Análisis aislado de URLs de códigos QR y QR Transparency Log (anti-quishing)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "cryptography>=43",
    "tldextract>=5",
]

[project.optional-dependencies]
# Cada imagen instala solo lo que necesita (menor superficie de ataque).
orquestador = ["docker>=7.1", "pillow>=11"]
worker = ["playwright==1.64.1"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "docker>=7.1",
    "pillow>=11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qrsandbox.orquestador" = ["*.json"]
"qrsandbox.senales" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Los tests de integración necesitan Docker + internet: se corren con `make test-int`.
addopts = "-m 'not integracion'"
markers = ["integracion: requiere Docker, la imagen del worker y acceso a internet"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
# La carpeta docker/ (Dockerfiles) confunde a isort: el SDK `docker` es de terceros.
known-third-party = ["docker"]
