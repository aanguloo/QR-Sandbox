# Override para probar desde el celular por la red local (make lan): HTTPS en 0.0.0.0:8443.
# La cámara, WebCrypto y la geolocalización exigen HTTPS fuera de localhost.
services:
  api:
    ports: !override
      - "0.0.0.0:${API_PORT_LAN:-8443}:8443"
    volumes:
      - ./data/tls:/tls:ro
    command: ["uvicorn", "qrsandbox.api.main:app", "--host", "0.0.0.0", "--port", "8443",
              "--ssl-keyfile", "/tls/clave.pem", "--ssl-certfile", "/tls/cert.pem"]
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request,sys; c=ssl.create_default_context(); c.check_hostname=False; c.verify_mode=ssl.CERT_NONE; sys.exit(0 if urllib.request.urlopen('https://127.0.0.1:8443/health', timeout=2, context=c).status == 200 else 1)"]
